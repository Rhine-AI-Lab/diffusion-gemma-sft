# CSCS Container Engine environment definition (EDF) for gdsdv2 (PyTorch/TRL SFT).
# Use with:  srun --environment=./cscs/gdsdv2-pt.toml ...
# Build the .sqsh referenced below with cscs/build_image.sh (see CSCS_SETUP.md).

image = "${SCRATCH}/ce-images/gdsdv2-pt+25.06.sqsh"

# Mount the Alps parallel filesystems so $SCRATCH (repo, venv, HF cache,
# checkpoints) is visible. NOTE: /users ($HOME) is intentionally NOT mounted, so
# anything the job reads (token, datasets, the repo itself) must live on $SCRATCH.
mounts = [
    "/capstor",
    "/iopsstor",
]

workdir = "${SCRATCH}/projects/gdsdv2"

[annotations]
# Slingshot NCCL plugin hook (multi-node). A single GH200 node (4 GPUs / NVLink)
# needs no OFI plugin; harmless to leave enabled for the single-GPU smoke test.
com.hooks.aws_ofi_nccl.enabled = "true"
com.hooks.aws_ofi_nccl.variant = "cuda12"

[env]
NCCL_DEBUG = "INFO"
CUDA_CACHE_DISABLE = "1"
# bitsandbytes on aarch64/GH200 ships its CUDA 12.8 build under this tag.
BNB_CUDA_VERSION = "128"
TORCH_NCCL_ASYNC_ERROR_HANDLING = "1"
MPICH_GPU_SUPPORT_ENABLED = "0"
# Keep the HuggingFace cache on $SCRATCH (already LUSTRE-striped) so the 26B
# checkpoint is downloaded once and reused across jobs.
HF_HOME = "${SCRATCH}/huggingface"
# Reduce allocator fragmentation when the 26B model fills most of the 96GB GH200.
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"
